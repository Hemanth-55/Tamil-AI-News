name: AI News

on:
  schedule:
    - cron: "15 12 * * *"      # The Tamil Journal: 7:15 AM Boston (12:15 UTC; 8:15 AM during daylight time)
    - cron: "*/30 * * * *"     # breaking-news check every 30 minutes
  workflow_dispatch:
    inputs:
      mode:
        description: "daily, breaking or resend"
        default: "daily"
  push:
    branches: [main]
    paths: ["send-now"]        # edit this file to send today's briefing again (e.g. after a design change)

permissions:
  contents: write

concurrency: news

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Build and send
        env:
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_MEDIA_URL: ${{ secrets.GREEN_MEDIA_URL }}
          GREEN_ID: ${{ secrets.GREEN_ID }}
          GREEN_TOKEN: ${{ secrets.GREEN_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE=resend; fi
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "15 12 * * *" ]; then MODE=daily; else MODE=breaking; fi
          fi
          if [ "$MODE" = "resend" ]; then export FORCE=1 IGNORE_SEEN=1; MODE=daily; fi
          python src/digest.py "$MODE"
      - name: Save the briefing and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests state
          git diff --cached --quiet || (git commit -m "AI news $(date -u +%F-%H%M)" && git pull -q --rebase && git push)
